services:
  hermes:
    depends_on:
      worker-opencode:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${HERMES_HOST_ROOT}/runtime/workers/opencode/socket
        target: /worker-sockets/opencode
        read_only: true

  worker-opencode:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        WORKER_NODE_IMAGE: ${WORKER_NODE_IMAGE:-node:22.18.0-bookworm-slim@sha256:752ea8a2f758c34002a0461bd9f1cee4f9a3c36d48494586f60ffce1fc708e0e}
        WORKER_KIND: opencode
        WORKER_CLI_VERSION: ${OPENCODE_CLI_VERSION:-1.18.11}
    image: hermes-worker-opencode:local
    user: "${HERMES_UID:-10000}:${HERMES_GID:-10000}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    environment:
      HOME: /home/worker
      XDG_DATA_HOME: /home/worker/.local/share
      XDG_CONFIG_HOME: /home/worker/.config
      XDG_CACHE_HOME: /home/worker/.cache
      OPENCODE_DISABLE_AUTOUPDATE: "1"
      OPENCODE_DISABLE_SHARE: "1"
      OPENCODE_DISABLE_DEFAULT_PLUGINS: "1"
      OPENCODE_DISABLE_PROJECT_CONFIG: "1"
      OPENCODE_DISABLE_CLAUDE_CODE: "1"
      OPENCODE_DISABLE_EXTERNAL_SKILLS: "1"
      OPENCODE_DISABLE_LSP_DOWNLOAD: "1"
      WORKER_KIND: opencode
      WORKER_HOME: /home/worker
      WORKER_WORKSPACE: /workspace
      WORKER_CONTROL_FILE: /worker-control/capabilities
      WORKER_CONTEXT: /worker-context
      WORKER_SOCKET: /worker-socket/worker.sock
      WORKER_TIMEOUT_MAX: "1800"
      NO_COLOR: "1"
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m
    volumes:
      - type: bind
        source: ${HERMES_HOST_ROOT}/runtime/workers/opencode/state
        target: /home/worker
      - type: bind
        source: ${HERMES_HOST_ROOT}/runtime/workers/opencode/workspace
        target: /workspace
      - type: bind
        source: ${HERMES_HOST_ROOT}/runtime/workers/opencode/socket
        target: /worker-socket
      - type: bind
        source: ${HERMES_HOST_ROOT}/runtime/control/workers/opencode
        target: /worker-control
        read_only: true
      - type: bind
        source: ${HERMES_HOST_ROOT}/worker-context/opencode
        target: /worker-context
        read_only: true
    healthcheck:
      test: [CMD-SHELL, "test -S /worker-socket/worker.sock"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks: [worker-opencode-egress]

networks:
  worker-opencode-egress:
    driver: bridge
