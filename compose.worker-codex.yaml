services:
  hermes:
    depends_on:
      worker-codex:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${HERMES_HOST_ROOT}/runtime/workers/codex/socket
        target: /worker-sockets/codex
        read_only: true

  worker-codex:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        WORKER_NODE_IMAGE: ${WORKER_NODE_IMAGE:-node:22.18.0-bookworm-slim@sha256:752ea8a2f758c34002a0461bd9f1cee4f9a3c36d48494586f60ffce1fc708e0e}
        WORKER_KIND: codex
        WORKER_CLI_VERSION: ${CODEX_CLI_VERSION:-0.146.0}
    image: hermes-worker-codex:local
    user: "${HERMES_UID:-10000}:${HERMES_GID:-10000}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    environment:
      HOME: /home/worker
      CODEX_HOME: /home/worker/.codex
      WORKER_KIND: codex
      WORKER_HOME: /home/worker
      WORKER_WORKSPACE: /workspace
      WORKER_CONTROL_FILE: /worker-control/capabilities
      WORKER_CONTEXT: /worker-context
      WORKER_SOCKET: /worker-socket/worker.sock
      WORKER_TIMEOUT_MAX: "1800"
      NO_COLOR: "1"
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m
    volumes:
      - type: bind
        source: ${HERMES_HOST_ROOT}/runtime/workers/codex/state
        target: /home/worker
      - type: bind
        source: ${HERMES_HOST_ROOT}/runtime/workers/codex/workspace
        target: /workspace
      - type: bind
        source: ${HERMES_HOST_ROOT}/runtime/workers/codex/socket
        target: /worker-socket
      - type: bind
        source: ${HERMES_HOST_ROOT}/runtime/control/workers/codex
        target: /worker-control
        read_only: true
      - type: bind
        source: ${HERMES_HOST_ROOT}/worker-context/codex
        target: /worker-context
        read_only: true
    healthcheck:
      test: [CMD-SHELL, "test -S /worker-socket/worker.sock"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks: [worker-codex-egress]

networks:
  worker-codex-egress:
    driver: bridge
