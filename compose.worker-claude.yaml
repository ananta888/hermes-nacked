services:
  hermes:
    depends_on:
      worker-claude:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${HERMES_HOST_ROOT}/runtime/workers/claude/socket
        target: /worker-sockets/claude
        read_only: true

  worker-claude:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        WORKER_NODE_IMAGE: ${WORKER_NODE_IMAGE:-node:22.18.0-bookworm-slim@sha256:752ea8a2f758c34002a0461bd9f1cee4f9a3c36d48494586f60ffce1fc708e0e}
        WORKER_KIND: claude
        WORKER_CLI_VERSION: ${CLAUDE_CLI_VERSION:-2.1.220}
    image: hermes-worker-claude:local
    user: "${HERMES_UID:-10000}:${HERMES_GID:-10000}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    environment:
      HOME: /home/worker
      CLAUDE_CONFIG_DIR: /home/worker/.claude
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      WORKER_KIND: claude
      WORKER_HOME: /home/worker
      WORKER_WORKSPACE: /workspace
      WORKER_SOCKET: /worker-socket/worker.sock
      WORKER_TIMEOUT_MAX: "1800"
      NO_COLOR: "1"
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m
    volumes:
      - type: bind
        source: ${HERMES_HOST_ROOT}/runtime/workers/claude/state
        target: /home/worker
      - type: bind
        source: ${HERMES_HOST_ROOT}/runtime/workers/claude/workspace
        target: /workspace
      - type: bind
        source: ${HERMES_HOST_ROOT}/runtime/workers/claude/socket
        target: /worker-socket
    healthcheck:
      test: [CMD-SHELL, "test -S /worker-socket/worker.sock"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks: [worker-claude-egress]

networks:
  worker-claude-egress:
    driver: bridge
